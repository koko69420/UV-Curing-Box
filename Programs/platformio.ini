; ============================================================================
; UV PCB Curing Box Firmware
; MCU:        CH32V003A4M6 (RISC-V, WCH)
; Framework:  Community-PIO-CH32V Arduino core
; ============================================================================

[env:ch32v003a4m6]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003A4M6
framework = arduino

; C++17 as required by the spec
build_flags =
    -std=gnu++17
    -Os

build_unflags =
    -std=gnu++11

; Upload via WCH-LinkE (SDI single wire debug interface)
upload_protocol = wch-link

monitor_speed = 115200

lib_deps =
    git+https://github.com/avishorp/TM1637.git